<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수학 문항 검수</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F5; --surface:#FFFFFF; --surface2:#F0EEE6;
  --glass:rgba(255,255,255,.72); --glass2:rgba(240,238,230,.82);
  --grid:rgba(31,30,29,.030);
  --text:#1F1E1D; --muted:#73726C; --border:#E4E1D5;
  --accent:#D97757; --accent-strong:#C15F3C; --accent-soft:#FBEEE8;
  --ok:#6E8B5E; --shadow:0 1px 3px rgba(31,30,29,.06),0 8px 24px rgba(31,30,29,.05);
  --glow1:rgba(217,119,87,.11); --glow2:rgba(226,192,138,.16);
  --glow3:rgba(110,139,94,.09);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#262624; --surface:#30302E; --surface2:#3A3937;
    --glass:rgba(48,48,46,.72); --glass2:rgba(58,57,55,.82);
    --grid:rgba(245,244,239,.035);
    --text:#F5F4EF; --muted:#A6A39A; --border:#45443F;
    --accent:#D97757; --accent-strong:#E08663; --accent-soft:#3E322C;
    --ok:#9DB88D; --shadow:0 1px 3px rgba(0,0,0,.3);
    --glow1:rgba(217,119,87,.13); --glow2:rgba(226,192,138,.07);
    --glow3:rgba(110,139,94,.08);
  }
}
*{box-sizing:border-box}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
     color:var(--text);max-width:720px;margin:0 auto;
     padding:48px 20px 60px;line-height:1.6;-webkit-font-smoothing:antialiased;
     background:
       radial-gradient(1100px 620px at 88% -12%, var(--glow1), transparent 62%),
       radial-gradient(900px 560px at -12% 34%, var(--glow2), transparent 60%),
       radial-gradient(760px 520px at 55% 112%, var(--glow3), transparent 62%),
       var(--bg);
     background-attachment:fixed;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
     background-image:
       linear-gradient(var(--grid) 1px, transparent 1px),
       linear-gradient(90deg, var(--grid) 1px, transparent 1px);
     background-size:26px 26px;
     -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.45) 55%,rgba(0,0,0,.15) 100%);
     mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.45) 55%,rgba(0,0,0,.15) 100%)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.mark{width:46px;height:46px;flex:none;border-radius:13px;
   background:linear-gradient(135deg,#E08663,#C15F3C);color:#fff;
   font-family:'Noto Serif KR',serif;font-weight:700;font-size:1.45rem;
   display:flex;align-items:center;justify-content:center;
   box-shadow:0 6px 16px rgba(217,119,87,.35),inset 0 1px 0 rgba(255,255,255,.25)}
h1{font-family:'Noto Serif KR',serif;font-size:2rem;font-weight:700;
   letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);font-size:.95rem;margin:0 0 8px}
.privacy{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);
   border:1px solid var(--border);border-radius:999px;padding:4px 14px;
   font-size:.82rem;color:var(--muted);margin-bottom:28px}
.privacy svg{width:13px;height:13px;flex:none}
#drop{background:var(--glass);backdrop-filter:blur(10px);
   -webkit-backdrop-filter:blur(10px);
   border:1.5px dashed var(--border);border-radius:16px;
   padding:52px 24px;text-align:center;cursor:pointer;transition:.18s;
   box-shadow:var(--shadow)}
#drop:hover,#drop.hover{border-color:var(--accent);background:var(--accent-soft)}
#drop svg{width:40px;height:40px;color:var(--accent);margin-bottom:12px}
#drop .t1{font-size:1.05rem;font-weight:600;margin-bottom:4px}
#drop .t2{font-size:.85rem;color:var(--muted)}
#drop.busy{pointer-events:none;opacity:.55}
#files{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
#files li{display:flex;align-items:center;gap:10px;background:var(--glass);
   backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
   border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:.92rem}
#files .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#files .size{color:var(--muted);font-size:.82rem;flex:none}
#files .rm{margin-left:auto;flex:none;border:0;background:none;color:var(--muted);
   cursor:pointer;font-size:1.05rem;padding:2px 6px;border-radius:6px}
#files .rm:hover{background:var(--surface2);color:var(--text)}
#files .doc{color:var(--accent);flex:none}
#go{width:100%;margin-top:16px;padding:14px;font-size:1.02rem;font-weight:700;
   font-family:inherit;border:0;border-radius:12px;
   background:linear-gradient(135deg,#E08663,#C8623F);
   box-shadow:0 6px 18px rgba(217,119,87,.30);
   color:#fff;cursor:pointer;transition:.15s;display:flex;align-items:center;
   justify-content:center;gap:10px}
#go:hover:not(:disabled){transform:translateY(-1px);
   box-shadow:0 9px 24px rgba(217,119,87,.38)}
#go:disabled{background:var(--border);color:var(--muted);cursor:default;
   box-shadow:none;transform:none}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);
   border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
#log{background:var(--glass2);backdrop-filter:blur(6px);
   -webkit-backdrop-filter:blur(6px);
   border:1px solid var(--border);border-radius:12px;
   padding:12px 16px;font-family:ui-monospace,Consolas,monospace;font-size:.8rem;
   white-space:pre-wrap;min-height:2.4em;max-height:200px;overflow-y:auto;
   margin-top:16px;color:var(--muted)}
#result{margin-top:24px}
#dl{display:inline-flex;align-items:center;gap:8px;margin-bottom:12px;
   padding:9px 20px;background:var(--surface);border:1px solid var(--border);
   border-radius:999px;color:var(--text);text-decoration:none;font-size:.9rem;
   font-weight:600;transition:.15s}
#dl:hover{border-color:var(--accent);color:var(--accent)}
#frame{width:100%;height:76vh;border:1px solid var(--border);border-radius:16px;
   background:#fff;box-shadow:var(--shadow)}
footer{margin-top:36px;text-align:center;font-size:.8rem;color:var(--muted)}
footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="brand"><div class="mark">∑</div><h1>수학 문항 검수</h1></div>
<p class="sub">정답↔해설 SymPy 검산 · 조판 결함 · 쪽 위치 · 쌍둥이문항 교차</p>
<div class="privacy">
  <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a3.5 3.5 0 0 0-3.5 3.5V6H4a1.5 1.5 0 0 0-1.5 1.5v5A1.5 1.5 0 0 0 4 14h8a1.5 1.5 0 0 0 1.5-1.5v-5A1.5 1.5 0 0 0 12 6h-.5V4.5A3.5 3.5 0 0 0 8 1Zm2 5H6V4.5a2 2 0 1 1 4 0V6Z"/></svg>
  모든 처리는 브라우저 안에서만 — 파일이 서버로 전송되지 않습니다
</div>

<div id="drop">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/>
  </svg>
  <div class="t1">hwpx 파일을 끌어다 놓거나 클릭해서 선택</div>
  <div class="t2">1~2개 · 2개면 쌍둥이 교차 검수 포함 · items.json도 가능</div>
</div>
<input type="file" id="fi" multiple accept=".hwpx,.json" hidden>
<ul id="files"></ul>
<button id="go" disabled>검수 시작</button>
<div id="log">엔진 준비 중… (최초 1회, 이후엔 캐시로 빨라집니다)</div>
<div id="result" hidden>
  <a id="dl" download="검수보고서.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
    보고서 파일로 저장</a>
  <iframe id="frame"></iframe>
</div>
<footer><a href="https://github.com/hclee-source/hwpx-math-check">hwpx-math-check</a>
 · 1차 기계 검수 — 최종 판단은 사람이 합니다</footer>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const $ = id => document.getElementById(id);
const BUILD = '20260729f';   // 스크립트 갱신 시 올린다 (캐시 무효화)
const PY_FILES = ['hml2sympy.py','eq_answer_check.py','twin_check.py',
                  'math_review.py','hwpx_items.py','report_html.py',
                  'extra_checks.py'];
let picked = [], pyReady = null, running = false;

function log(msg, replace=false){
  const el = $('log');
  if (replace) el.textContent = el.textContent.replace(/\n?[^\n]*$/, '\n' + msg);
  else el.textContent += (el.textContent ? '\n' : '') + msg;
  el.scrollTop = el.scrollHeight;
}

async function boot(){
  const py = await loadPyodide();
  log('수학 엔진 로딩 중… (sympy, lxml)');
  await py.loadPackage(['sympy','lxml']);
  py.FS.mkdirTree('/work/scripts');
  // 스크립트는 항상 최신을 받는다 — 캐시된 옛 버전과 새 index.html이 섞이면
  // render() 인자 불일치 같은 TypeError가 난다
  for (const f of PY_FILES){
    const r = await fetch('scripts/' + f + '?v=' + BUILD, {cache: 'no-store'});
    if (!r.ok) throw new Error('스크립트 로드 실패: ' + f);
    py.FS.writeFile('/work/scripts/' + f, await r.text());
  }
  await py.runPythonAsync(
    "import sys\nsys.path.insert(0, '/work/scripts')\n" +
    "import json, hwpx_items, eq_answer_check, twin_check, math_review, " +
    "report_html, extra_checks");
  const okSig = await py.runPythonAsync(
    "import inspect\n'extras' in inspect.signature(report_html.render).parameters");
  if (!okSig) throw new Error(
    '스크립트 버전이 맞지 않습니다. Ctrl+F5로 강력 새로고침 해주세요.');
  log('준비 완료. 파일을 선택하세요.');
  return py;
}
pyReady = boot().catch(e => { log('엔진 로딩 실패: ' + e); });

function renderFiles(){
  $('files').innerHTML = picked.map((f, i) =>
    `<li><svg class="doc" width="16" height="16" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
     <span class="name">${f.name}</span>
     <span class="size">${(f.size/1024).toFixed(0)} KB</span>
     <button class="rm" data-i="${i}" title="제거">✕</button></li>`).join('');
  document.querySelectorAll('#files .rm').forEach(b =>
    b.onclick = () => { picked.splice(+b.dataset.i, 1); renderFiles(); });
  $('go').disabled = picked.length === 0 || running;
}
function setFiles(list){
  picked = [...list].filter(f => /\.(hwpx|json)$/i.test(f.name)).slice(0, 2);
  renderFiles();
  if (picked.length) log(`파일 ${picked.length}개 선택됨. [검수 시작]을 누르세요.`);
}
$('drop').onclick = () => $('fi').click();
$('fi').onchange = e => setFiles(e.target.files);
$('drop').ondragover = e => { e.preventDefault(); $('drop').classList.add('hover'); };
$('drop').ondragleave = () => $('drop').classList.remove('hover');
$('drop').ondrop = e => {
  e.preventDefault(); $('drop').classList.remove('hover');
  setFiles(e.dataTransfer.files);
};

$('go').onclick = async () => {
  running = true;
  $('go').disabled = true;
  $('go').innerHTML = '<span class="spin"></span>검수 중…';
  $('drop').classList.add('busy');
  $('result').hidden = true;
  try {
    const py = await pyReady;
    if (!py) throw new Error('엔진이 준비되지 않았습니다. 새로고침 후 다시 시도하세요.');
    const names = [];
    for (let i = 0; i < picked.length; i++){
      const f = picked[i];
      const path = '/work/in_' + i + (f.name.toLowerCase().endsWith('.json') ? '.json' : '.hwpx');
      py.FS.writeFile(path, new Uint8Array(await f.arrayBuffer()));
      names.push({path, name: f.name});
    }
    py.globals.set('js_progress', (i, n) => log(`   검산 중… ${i}/${n} 문항`, true));
    py.globals.set('js_log', m => log(m));
    py.globals.set('inputs', py.toPy(names.map(x => [x.path, x.name])));

    const html = await py.runPythonAsync(`
import json
jsons, srcs = [], []
for path, name in inputs:
    if path.endswith('.json'):
        jsons.append(path); srcs.append(name)
        js_log(f'[입력] {name} (파싱 생략)')
    else:
        js_log(f'[파싱] {name} …')
        recs, skipped = hwpx_items.parse(path)
        data = hwpx_items.to_items_json(recs, name)
        js_log(f'   문항 {data["n"]}개 (표 건너뜀 {skipped}개)')
        if data['n'] == 0:
            js_log('   ⚠ 문항 없음 — 문항 은행 구조(2열 표)가 맞는지 확인하세요')
        out = path + '.items.json'
        json.dump(data, open(out, 'w'), ensure_ascii=False)
        jsons.append(out); srcs.append(name)

findings, stats, details, extras = [], {}, {}, {}
datas = []
for jp, name in zip(jsons, srcs):
    d = json.load(open(jp))
    datas.append(d)
    js_log(f'[검산] {name} — {len(d["items"])}문항')
    js_progress(0, len(d['items']))
    f, st, dt = eq_answer_check.check(d['items'], progress=js_progress)
    ex = extra_checks.analyze(d)
    f += ex['findings']
    for x in f: x['file'] = name
    findings += f; stats['검산:' + name] = dict(st); details[name] = dt
    extras[name] = ex
    js_log(f'   완료: {dict(st)} · 메모 {len(ex["memos"])} · '
           f'표기 {sum(t["n"] for t in ex["style"].values())} · 중복후보 {len(ex["dups"])}')

if len(datas) == 2:
    js_log('[교차] 쌍둥이문항 검수')
    n_twin = lambda d: sum(1 for i in d['items'] if i['meta'].get('쌍둥이문항','').strip())
    ev, gn = sorted(datas, key=n_twin, reverse=True)
    f, st = twin_check.check(ev['items'], gn['items'])
    for x in f: x['file'] = '쌍둥이교차'
    findings += f; stats['쌍둥이'] = dict(st)

findings.sort(key=lambda x: ({'high':0,'medium':1,'low':2}.get(x.get('sev'), 9), x['code']))
js_log(f'검수 완료: 결함 후보 {len(findings)}건')
items_map = {i['meta'].get('문항id', i.get('loc', '')): i
             for d in datas for i in d['items']}
report_html.render(findings, stats, details, srcs, items=items_map, extras=extras)
`);
    $('frame').srcdoc = html;
    $('dl').href = URL.createObjectURL(new Blob([html], {type: 'text/html'}));
    $('result').hidden = false;
    $('result').scrollIntoView({behavior: 'smooth'});
  } catch (e) {
    log('오류: ' + e);
  } finally {
    running = false;
    $('go').textContent = '검수 시작';
    $('drop').classList.remove('busy');
    $('go').disabled = picked.length === 0;
  }
};
</script>
</body>
</html>
